name: zenly

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zenly
      POSTGRES_PASSWORD: zenly
      POSTGRES_DB: zenly
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a local Postgres on 5432).
      - "5433:5432"
    volumes:
      - zenly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenly -d zenly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://zenly:zenly@db:5432/zenly?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  zenly_pgdata:
